name: Preview feature branch on GitHub Pages

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_BASE: /my-portfolio/
  PREVIEW_BASE: /my-portfolio/feature-check/

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build feature branch
        run: |
          npm install
          VITE_BASE="$PREVIEW_BASE" npm run build
          mv dist feature-dist

      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Build current production site
        working-directory: production-source
        run: |
          npm install
          VITE_BASE="$PRODUCTION_BASE" npm run build

      - name: Combine production and feature preview
        run: |
          rm -rf site
          mkdir -p site
          cp -R production-source/dist/. site/
          mkdir -p site/feature-check
          cp -R feature-dist/. site/feature-check/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy feature preview
        id: deployment
        uses: actions/deploy-pages@v4
